<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wana Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #06141f;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: #06141f;
        }
        .top-header {
            background: #0b1d2d;
            padding: 6px;
            border-bottom: 1px solid #1c364d;
        }
        .connection-status {
            font-size: 12px;
            color: #00ffcc;
            background: #112d42;
            padding: 4px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .top-stats-row {
            display: flex;
            justify-content: space-between;
            gap: 3px;
            margin-bottom: 5px;
        }
        .stat-box {
            background: #0f2537;
            border: 1px solid #1c364d;
            border-radius: 5px;
            padding: 4px 6px;
            font-size: 11px;
            flex: 1;
            color: #00ffcc;
            font-weight: bold;
        }
        .stat-box span {
            display: block;
            font-size: 9px;
            color: #8ab4f8;
        }
        .jackpot-bar {
            background: #0f2537;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 4px;
        }
        .live-tag {
            background: #00cc66;
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
        }
        .timer-banner {
            color: #ffcc00;
            font-weight: bold;
            font-size: 12px;
            margin: 3px 0;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            background: #0f2537;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .num-btn {
            background-color: #1c364d;
            color: #fff;
            border: 1px solid #284b66;
            padding: 8px 2px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .num-btn.booked {
            background-color: #ff3333 !important;
            cursor: not-allowed;
        }
        .num-btn.selected {
            background-color: #00cc66 !important;
            color: #06141f;
        }
        .bottom-action-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 6px;
        }
        .btn-action {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            color: #fff;
        }
        .refresh { background-color: #115d75; flex: 1; }
        .select { background-color: #00cc66; flex: 1.5; color: #06141f; }
        .start { background-color: #ff6600; flex: 1.5; }

        .screen { display: none; }
        .screen.active { display: block; }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #0b1d2d;
            border-top: 1px solid #1c364d;
            padding: 6px 0;
            font-size: 10px;
            color: #aaa;
        }
        .nav-item { cursor: pointer; }
        .nav-item.active-nav {
            color: #ffcc00;
            font-weight: bold;
        }
        .game-layout {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: flex-start;
        }
        .left-balls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: #0f2537;
            padding: 6px;
            border-radius: 8px;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid #1c364d;
        }
        .mini-ball {
            background: #1c364d;
            border: 1px solid #284b66;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 6px;
            border-radius: 4px;
            text-align: center;
        }
        .mini-ball.called {
            background-color: #00cc66;
            color: #06141f;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .current-call-box {
            background: #0f2537;
            border: 1px solid #00ffcc;
            padding: 6px;
            border-radius: 6px;
        }
        .current-ball-num {
            font-size: 22px;
            color: #00ffcc;
            font-weight: bold;
        }
        .user-card-small {
            background: #0f2537;
            border: 1px solid #ffcc00;
            padding: 6px;
            border-radius: 6px;
        }
        .bingo-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }
        .bingo-table th {
            background-color: #ff6600;
            color: white;
            font-size: 11px;
            padding: 4px;
            border: 1px solid #00ffcc;
        }
        .bingo-table td {
            border: 1px solid #00ffcc;
            padding: 5px;
            font-size: 12px;
            font-weight: bold;
            background: #06141f;
            color: #fff;
        }
        .bingo-table td.marked {
            background-color: #00cc66;
            color: #06141f;
        }
        .bingo-btn {
            background-color: #ffcc00;
            color: #06141f;
            border: none;
            padding: 7px;
            width: 100%;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }
        .profile-box {
            background: #0f2537;
            border: 1px solid #1c364d;
            border-radius: 8px;
            padding: 12px;
            margin: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <div class="connection-status" id="connectionStatus">🟢 Connected to Database</div>
        <div class="top-stats-row">
            <div class="stat-box" onclick="switchScreen('selectionScreen')"><span>Back</span>←</div>
            <div class="stat-box"><span>Wallet</span><span id="walletDisplay">10</span></div>
            <div class="stat-box"><span>Players</span><span id="activePlayersDisplay">0</span></div>
            <div class="stat-box"><span>Stake</span>10</div>
            <div class="stat-box"><span>Bonus</span><span id="bonusDisplay">10</span></div>
        </div>
        <div class="jackpot-bar">
            <span>PRIZE: <span id="prizePoolDisplay">50</span> ETB</span>
            <span class="live-tag" id="gameStatusTag">WAITING</span>
        </div>
        <div class="timer-banner" id="gameTimerDisplay">ቢያንስ 2 ተጫዋቾች ይጠበቃሉ...</div>
    </div>

    <div class="main-content">
        <!-- Selection Screen -->
        <div id="selectionScreen" class="screen active">
            <div class="numbers-grid" id="numbersGrid"></div>
            <div class="bottom-action-buttons">
                <button class="btn-action refresh" onclick="fetchBookedCartelas()">Refresh Grid</button>
                <button class="btn-action select" id="selectBtn" onclick="confirmSelection()">Select Number</button>
                <button class="btn-action start" onclick="goToGameScreen()">Start Game</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-layout">
                <div class="left-balls-grid" id="leftBallsGrid"></div>
                <div class="right-panel">
                    <div class="current-call-box">
                        <div style="font-size: 10px; color: #ffcc00;">Current Call (<span id="callCountDisplay">0</span>/75)</div>
                        <div class="current-ball-num" id="currentBallDisplay">--</div>
                    </div>
                    <div class="user-card-small">
                        <div id="cardTitle" style="font-size: 11px; color: #ffcc00; margin-bottom: 3px;">ካርቴላ ቁጥር: #--</div>
                        <table class="bingo-table">
                            <thead>
                                <tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>
                            </thead>
                            <tbody id="bingoCardBody"></tbody>
                        </table>
                        <button class="bingo-btn" onclick="declareBingo()">BINGO! 🎉</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Screen -->
        <div id="profileScreen" class="screen">
            <div class="profile-box">
                <div style="font-size: 14px; color: #ffcc00; font-weight: bold;" id="profileName">Player Profile</div>
                <div style="font-size: 11px; color: #00ffcc; margin-top: 5px;" id="profilePhone">📞 --------</div>
                <hr style="border-color: #1c364d; margin: 8px 0;">
                <div style="font-size: 11px; display: flex; justify-content: space-between;">
                    <span>Current Balance:</span>
                    <span style="color: #00ffcc; font-weight: bold;">ETB <span id="profileWallet">10</span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="alert('Leaderboard coming soon!')">🏆<br>Leaderboard</div>
        <div class="nav-item active-nav" id="navPlay" onclick="switchScreen('selectionScreen')">🏆<br>Play</div>
        <div class="nav-item" id="navProfile" onclick="switchScreen('profileScreen')">👤<br>Profile</div>
    </div>
</div>

<script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.expand(); }
    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    
    const userId = tgUser ? String(tgUser.id) : "7169703901"; 

    // 👉 አዲሱ የ Pydroid 3 አይፒ አድራሻ በትክክል ተካቷል
    const API_BASE = "http://10.126.240.95:5000"; 

    let userWallet = 10;
    let userBonus = 10;
    let activePlayers = 0;
    const grid = document.getElementById('numbersGrid');
    let bookedNumbers = [];
    let selectedNumber = null;

    async function fetchUserProfile() {
        try {
            const response = await fetch(`${API_BASE}/api/user/${userId}`);
            const data = await response.json();
            if(data.success) {
                userWallet = data.wallet;
                userBonus = data.bonus;
                document.getElementById('walletDisplay').innerText = userWallet;
                document.getElementById('bonusDisplay').innerText = userBonus;
                document.getElementById('profileWallet').innerText = userWallet;
                document.getElementById('profileName').innerText = data.username + " (Player Profile)";
                document.getElementById('profilePhone').innerText = "📞 " + data.phone;
                document.getElementById('connectionStatus').innerText = "🟢 Connected to Database";
            }
        } catch (error) {
            console.error("Error fetching user profile:", error);
            document.getElementById('connectionStatus').innerText = "🔴 ከሰርቨር ጋር መገናኘት አልተቻለም";
        }
    }

    async function fetchBookedCartelas() {
        try {
            const response = await fetch(`${API_BASE}/api/booked`);
            const data = await response.json();
            bookedNumbers = data.booked;
            activePlayers = data.active_players;
            
            document.getElementById('activePlayersDisplay').innerText = activePlayers;
            
            let calculatedPrize = Math.max(50, activePlayers * 10 * 1.5);
            document.getElementById('prizePoolDisplay').innerText = calculatedPrize;

            buildGrid();
            document.getElementById('connectionStatus').innerText = "🟢 Connected to Database";
        } catch (error) {
            console.error("Error fetching booked cartelas:", error);
            document.getElementById('connectionStatus').innerText = "🔴 ከሰርቨር ጋር መገናኘት አልተቻለም";
            buildGrid();
        }
    }

    function buildGrid() {
        grid.innerHTML = "";
        for (let i = 1; i <= 500; i++) {
            const btn = document.createElement('button');
            btn.classList.add('num-btn');
            btn.innerText = i;

            if (bookedNumbers.includes(i)) {
                btn.classList.add('booked');
                btn.onclick = () => {
                    alert(`⚠️ ካርቴላ ቁጥር #${i} በሌላ ተጫዋች ተይዟል!`);
                };
            } else {
                btn.onclick = () => {
                    document.querySelectorAll('.num-btn').forEach(b => {
                        if(!b.classList.contains('booked')) b.classList.remove('selected');
                    });
                    btn.classList.add('selected');
                    selectedNumber = i;
                    document.getElementById('selectBtn').innerText = `Selected: #${i}`;
                };
            }
            grid.appendChild(btn);
        }
    }

    async function confirmSelection() {
        if (!selectedNumber) {
            alert("እባክዎ መጀመሪያ ካርቴላ ይምረጡ!");
            return;
        }
        try {
            const response = await fetch(`${API_BASE}/api/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, cartela_num: selectedNumber })
            });
            const result = await response.json();
            if(!result.success) { 
                alert(result.message); 
                return; 
            }
            alert(`✅ ካርቴላ ቁጥር #${selectedNumber} በትክክል ተይዟል!`);
            fetchBookedCartelas();
        } catch(e) {
            console.error(e);
            alert("⚠️ ከሰርቨር ጋር መገናኘት አልተቻለም። እባክዎ Pydroid 3 ሰርቨር መብራቱን እና የአይፒ አድራሻው ትክክል መሆኑን ያረጋግጡ።");
        }
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        if(screenId === 'profileScreen') {
            document.getElementById('navProfile').classList.add('active-nav');
            fetchUserProfile();
        } else {
            document.getElementById('navPlay').classList.add('active-nav');
        }
    }

    let callInterval = null;

    function goToGameScreen() {
        if (!selectedNumber) {
            alert("እባክዎ መጀመሪያ ካርቴላ ይምረጡ!");
            return;
        }

        if (activePlayers < 2) {
            alert("⚠️ ጨዋታው ለመጀመር ቢያንስ 2 እና ከዛ በላይ ተጫዋቾች መኖር አለባቸው! እባክዎ ሌሎች ተጫዋቾች እስኪቀላቀሉ ይጠብቁ።");
            return;
        }

        if (userWallet < 10) {
            alert("⚠️ በቂ ገንዘብ የለዎትም! እባክዎ ዎሌትዎን ይሙሉ (Deposit)።");
            return;
        }

        userWallet -= 10;
        document.getElementById('walletDisplay').innerText = userWallet;
        document.getElementById('profileWallet').innerText = userWallet;

        switchScreen('gameScreen');
        setupGameScreen();
        startCallingBalls();
    }

    function setupGameScreen() {
        const leftGrid = document.getElementById('leftBallsGrid');
        leftGrid.innerHTML = "";
        for (let i = 1; i <= 75; i++) {
            const ballDiv = document.createElement('div');
            ballDiv.classList.add('mini-ball');
            ballDiv.id = `ball-cell-${i}`;
            ballDiv.innerText = i;
            leftGrid.appendChild(ballDiv);
        }

        document.getElementById('cardTitle').innerText = `ካርቴላ ቁጥር: #${selectedNumber}`;
        const tbody = document.getElementById('bingoCardBody');
        tbody.innerHTML = "";

        const ranges = [[1, 15], [16, 30], [31, 45], [46, 60], [61, 75]];
        let cardCols = [];
        for (let col = 0; col < 5; col++) {
            let colNums = [];
            let min = ranges[col][0], max = ranges[col][1];
            while (colNums.length < 5) {
                let rand = Math.floor(Math.random() * (max - min + 1)) + min;
                if (!colNums.includes(rand)) colNums.push(rand);
            }
            cardCols.push(colNums);
        }

        for (let r = 0; r < 5; r++) {
            const row = document.createElement('tr');
            for (let c = 0; c < 5; c++) {
                const cell = document.createElement('td');
                if (r === 2 && c === 2) {
                    cell.innerText = "★";
                    cell.classList.add('marked');
                } else {
                    cell.innerText = cardCols[c][r];
                    cell.id = `cell-${cardCols[c][r]}`;
                }
                row.appendChild(cell);
            }
            tbody.appendChild(row);
        }
    }

    let calledBallsList = [];
    let callCount = 0;

    function startCallingBalls() {
        document.getElementById('gameStatusTag').innerText = "LIVE";
        callInterval = setInterval(() => {
            let availableBalls = [];
            for (let i = 1; i <= 75; i++) {
                if (!calledBallsList.includes(i)) availableBalls.push(i);
            }
            if (availableBalls.length === 0) return;

            const randomBall = availableBalls[Math.floor(Math.random() * availableBalls.length)];
            calledBallsList.push(randomBall);
            callCount++;

            document.getElementById('currentBallDisplay').innerText = randomBall;
            document.getElementById('callCountDisplay').innerText = callCount;

            const ballCell = document.getElementById(`ball-cell-${randomBall}`);
            if (ballCell) ballCell.classList.add('called');

            const cardCell = document.getElementById(`cell-${randomBall}`);
            if (cardCell) cardCell.classList.add('marked');
        }, 2500);
    }

    function checkBingo() {
        const size = 5;
        let winningLines = 0;
        const tbody = document.getElementById('bingoCardBody');
        const rows = tbody.getElementsByTagName('tr');
        
        let boardState = [];
        for (let r = 0; r < size; r++) {
            let rowArr = [];
            const cells = rows[r].getElementsByTagName('td');
            for (let c = 0; c < size; c++) {
                rowArr.push({ marked: cells[c].classList.contains('marked') });
            }
            boardState.push(rowArr);
        }

        for (let r = 0; r < size; r++) {
            let rowWin = true;
            for (let c = 0; c < size; c++) {
                if (r === 2 && c === 2) continue;
                if (!boardState[r][c].marked) { rowWin = false; break; }
            }
            if (rowWin) winningLines++;
        }

        for (let c = 0; c < size; c++) {
            let colWin = true;
            for (let r = 0; r < size; r++) {
                if (r === 2 && c === 2) continue;
                if (!boardState[r][c].marked) { colWin = false; break; }
            }
            if (colWin) winningLines++;
        }

        let diag1Win = true, diag2Win = true;
        for (let i = 0; i < size; i++) {
            if (i === 2) continue;
            if (!boardState[i][i].marked) diag1Win = false;
            if (!boardState[i][size - 1 - i].marked) diag2Win = false;
        }
        if (diag1Win) winningLines++;
        if (diag2Win) winningLines++;

        return winningLines > 0;
    }

    function declareBingo() {
        if (activePlayers < 2) {
            alert("⚠️ በጨዋታው ውስጥ ቢያንስ 2 ተጫዋቾች መኖር አለባቸው!");
            return;
        }

        if (checkBingo()) {
            if (callInterval) clearInterval(callInterval);
            let currentPrize = parseFloat(document.getElementById('prizePoolDisplay').innerText) || 150;
            
            alert(`🎉 እንኳን ደስ አለዎት! ${currentPrize} ETB አሸንፈዋል! 🏆`);
            userWallet += currentPrize;
            document.getElementById('walletDisplay').innerText = userWallet;
            document.getElementById('profileWallet').innerText = userWallet;
            switchScreen('selectionScreen');
        } else {
            alert("⚠️ እስካሁን የተዘጋ ሙሉ መስመር የለም። እባክዎ ተጨማሪ ኳሶች እንዲጠሩ ይጠብቁ!");
        }
    }

    fetchUserProfile();
    fetchBookedCartelas();
    setInterval(fetchBookedCartelas, 3000);
</script>

</body>
</html>
