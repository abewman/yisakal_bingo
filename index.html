<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wana Bingo</title>
    <style>
        body {
            background-color: #06141f;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: #06141f;
        }
        .top-header {
            background: #0b1d2d;
            padding: 5px;
            border-bottom: 1px solid #1c364d;
        }
        .connection-status {
            font-size: 11px;
            color: #00ffcc;
            background: #112d42;
            padding: 3px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .top-stats-row {
            display: flex;
            justify-content: space-between;
            gap: 2px;
            margin-bottom: 4px;
        }
        .stat-box {
            background: #0f2537;
            border: 1px solid #1c364d;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 10px;
            flex: 1;
            color: #00ffcc;
        }
        .stat-box span {
            display: block;
            font-size: 8px;
            color: #8ab4f8;
        }
        .jackpot-bar {
            background: #0f2537;
            border: 1px solid #00ffcc;
            border-radius: 4px;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 3px;
        }
        .live-tag {
            background: #00cc66;
            color: #000;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 8px;
        }
        .timer-banner {
            color: #00ffcc;
            font-weight: bold;
            font-size: 11px;
            margin: 2px 0;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            background: #0f2537;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .num-btn {
            background-color: #1c364d;
            color: #fff;
            border: none;
            padding: 6px 1px;
            font-size: 9px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }
        .num-btn.booked {
            background-color: #ff3333 !important;
        }
        .num-btn.selected {
            background-color: #00cc66 !important;
        }
        .bottom-action-buttons {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-bottom: 5px;
        }
        .btn-action {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            color: #fff;
        }
        .refresh { background-color: #115d75; flex: 1; }
        .select { background-color: #00cc66; flex: 1.5; }
        .start { background-color: #ff6600; flex: 1.5; }

        .screen { display: none; }
        .screen.active { display: block; }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #0b1d2d;
            border-top: 1px solid #1c364d;
            padding: 4px 0;
            font-size: 9px;
            color: #aaa;
        }
        .nav-item.active-nav {
            color: #ffcc00;
            font-weight: bold;
        }
        .game-layout {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: flex-start;
        }
        .left-balls-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            background: #0f2537;
            padding: 5px;
            border-radius: 6px;
            max-height: 260px;
            overflow-y: auto;
        }
        .mini-ball {
            background: #1c364d;
            border: 1px solid #444;
            color: #fff;
            font-size: 9px;
            padding: 4px;
            border-radius: 3px;
            text-align: center;
        }
        .mini-ball.called {
            background-color: #00cc66;
            font-weight: bold;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .current-call-box {
            background: #0f2537;
            border: 1px solid #00ffcc;
            padding: 4px;
            border-radius: 6px;
        }
        .current-ball-num {
            font-size: 18px;
            color: #00ffcc;
            font-weight: bold;
        }
        .user-card-small {
            background: #0f2537;
            border: 1px solid #ffcc00;
            padding: 4px;
            border-radius: 6px;
        }
        .bingo-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2px;
        }
        .bingo-table th {
            background-color: #ff6600;
            color: white;
            font-size: 9px;
            padding: 2px;
            border: 1px solid #00ffcc;
        }
        .bingo-table td {
            border: 1px solid #00ffcc;
            padding: 3px;
            font-size: 9px;
            font-weight: bold;
            background: #06141f;
            color: #fff;
        }
        .bingo-table td.marked {
            background-color: #00cc66;
            color: #06141f;
        }
        .bingo-btn {
            background-color: #ffcc00;
            color: #06141f;
            border: none;
            padding: 5px;
            width: 100%;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 3px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <div class="connection-status">🟢 Connected</div>
        <div class="top-stats-row">
            <div class="stat-box"><span>Back</span>←</div>
            <div class="stat-box"><span>Wallet</span>0</div>
            <div class="stat-box"><span>Active Games</span>1</div>
            <div class="stat-box"><span>Stake</span>10</div>
            <div class="stat-box"><span>Bonus</span>0</div>
        </div>
        <div class="jackpot-bar">
            <span>10 ETB JACKPOT 146 / 500</span>
            <span class="live-tag">LIVE</span>
        </div>
        <div class="timer-banner" id="gameTimerDisplay">Starting game in 24 sec</div>
    </div>

    <div class="main-content">
        <div id="selectionScreen" class="screen active">
            <div class="numbers-grid" id="numbersGrid"></div>
            <div class="bottom-action-buttons">
                <button class="btn-action refresh" onclick="location.reload()">Refresh</button>
                <button class="btn-action select" id="selectBtn">Select Number</button>
                <button class="btn-action start" onclick="goToGameScreen()">Start Game</button>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="game-layout">
                <div class="left-balls-grid" id="leftBallsGrid"></div>
                <div class="right-panel">
                    <div class="current-call-box">
                        <div style="font-size: 10px; color: #ffcc00;">Current Call</div>
                        <div class="current-ball-num" id="currentBallDisplay">--</div>
                    </div>
                    <div class="user-card-small">
                        <div id="cardTitle" style="font-size: 10px; color: #ffcc00; margin-bottom: 2px;">ካርቴላ ቁጥር: #--</div>
                        <table class="bingo-table">
                            <thead>
                                <tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr>
                            </thead>
                            <tbody id="bingoCardBody"></tbody>
                        </table>
                        <button class="bingo-btn" onclick="declareBingo()">BINGO! 🎉</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item">🏆<br>Leaderboard</div>
        <div class="nav-item active-nav">🏆<br>Play</div>
        <div class="nav-item">👤<br>Profile</div>
    </div>
</div>

<script>
    let selectedNumber = null;
    const grid = document.getElementById('numbersGrid');
    const bookedNumbers = [3, 7, 12, 18, 25, 34, 46, 52, 63, 72, 85, 94, 105, 120, 135, 142];

    for (let i = 1; i <= 500; i++) {
        const btn = document.createElement('button');
        btn.classList.add('num-btn');
        btn.innerText = i;

        if (bookedNumbers.includes(i)) {
            btn.classList.add('booked');
        } else {
            btn.onclick = () => {
                document.querySelectorAll('.num-btn').forEach(b => {
                    if(!b.classList.contains('booked')) b.classList.remove('selected');
                });
                btn.classList.add('selected');
                selectedNumber = i;
            };
        }
        grid.appendChild(btn);
    }

    function goToGameScreen() {
        if (!selectedNumber) {
            alert("እባክዎ መጀመሪያ ካርቴላ ይምረጡ!");
            return;
        }

        document.getElementById('selectionScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');

        setupGameScreen();
        startCountdownAndGame();
    }

    function setupGameScreen() {
        const leftGrid = document.getElementById('leftBallsGrid');
        leftGrid.innerHTML = "";
        for (let i = 1; i <= 75; i++) {
            const ballDiv = document.createElement('div');
            ballDiv.classList.add('mini-ball');
            ballDiv.id = `ball-cell-${i}`;
            ballDiv.innerText = i;
            leftGrid.appendChild(ballDiv);
        }

        document.getElementById('cardTitle').innerText = `ካርቴላ ቁጥር: #${selectedNumber}`;
        const tbody = document.getElementById('bingoCardBody');
        tbody.innerHTML = "";

        const ranges = [[1, 15], [16, 30], [31, 45], [46, 60], [61, 75]];
        let cardCols = [];
        for (let col = 0; col < 5; col++) {
            let colNums = [];
            let min = ranges[col][0], max = ranges[col][1];
            while (colNums.length < 5) {
                let rand = Math.floor(Math.random() * (max - min + 1)) + min;
                if (!colNums.includes(rand)) colNums.push(rand);
            }
            cardCols.push(colNums);
        }

        for (let r = 0; r < 5; r++) {
            const row = document.createElement('tr');
            for (let c = 0; c < 5; c++) {
                const cell = document.createElement('td');
                if (r === 2 && c === 2) {
                    cell.innerText = "★";
                    cell.classList.add('marked');
                } else {
                    cell.innerText = cardCols[c][r];
                    cell.id = `cell-${cardCols[c][r]}`;
                }
                row.appendChild(cell);
            }
            tbody.appendChild(row);
        }
    }

    function startCountdownAndGame() {
        let timeLeft = 24;
        const timerDisplay = document.getElementById('gameTimerDisplay');
        
        let countdownTimer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerDisplay.innerText = `Starting game in ${timeLeft} sec`;
            } else {
                clearInterval(countdownTimer);
                timerDisplay.innerText = "🎲 ጨዋታው ተጀምሯል! (Live Game)";
                startCallingBalls();
            }
        }, 1000);
    }

    let calledBallsList = [];
    function startCallingBalls() {
        setInterval(() => {
            let availableBalls = [];
            for (let i = 1; i <= 75; i++) {
                if (!calledBallsList.includes(i)) availableBalls.push(i);
            }
            if (availableBalls.length === 0) return;

            const randomBall = availableBalls[Math.floor(Math.random() * availableBalls.length)];
            calledBallsList.push(randomBall);

            document.getElementById('currentBallDisplay').innerText = randomBall;

            const ballCell = document.getElementById(`ball-cell-${randomBall}`);
            if (ballCell) ballCell.classList.add('called');

            const cardCell = document.getElementById(`cell-${randomBall}`);
            if (cardCell) cardCell.classList.add('marked');
        }, 2500);
    }

    function declareBingo() {}
</script>

</body>
</html>
